<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Mathew Hartley, Senior Product Engineer</title>
  <desc id="d">A 90s personal-homepage style share card in a retro browser window: Mathew Hartley, Senior Product Engineer, building AI agents, Wellington, New Zealand.</desc>
  <defs>
    <pattern id="desk" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#008080"/><rect width="4" height="4" fill="#007878"/><rect x="4" y="4" width="4" height="4" fill="#007878"/>
    </pattern>
    <linearGradient id="titlebar" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient>
    <linearGradient id="rainbow" x1="0" x2="1">
      <stop offset="0" stop-color="#ff00ff"/><stop offset="0.25" stop-color="#00ffff"/><stop offset="0.5" stop-color="#ffff00"/><stop offset="0.75" stop-color="#00ff00"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#ffff00"/><rect width="14" height="28" fill="#000"/>
    </pattern>
  </defs>

  <!-- Win95 desktop -->
  <rect width="1200" height="630" fill="url(#desk)"/>

  <!-- browser window (bevelled) -->
  <rect x="24" y="20" width="1152" height="590" fill="#c0c0c0"/>
  <path d="M24 610V20h1152" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M24 610h1152V20" fill="none" stroke="#000" stroke-width="3"/>
  <!-- title bar -->
  <rect x="32" y="28" width="1136" height="40" fill="url(#titlebar)"/>
  <text x="48" y="56" fill="#fff" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="21">Mathew Hartley's Home Page - Netscape Navigator</text>
  <g font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="18" text-anchor="middle">
    <rect x="1066" y="34" width="28" height="26" fill="#c0c0c0" stroke="#000" stroke-width="2"/><text x="1080" y="54">_</text>
    <rect x="1100" y="34" width="28" height="26" fill="#c0c0c0" stroke="#000" stroke-width="2"/><text x="1114" y="54">□</text>
    <rect x="1134" y="34" width="28" height="26" fill="#c0c0c0" stroke="#000" stroke-width="2"/><text x="1148" y="54">×</text>
  </g>
  <!-- address bar -->
  <text x="40" y="96" fill="#000" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18">Location:</text>
  <rect x="134" y="76" width="1030" height="30" fill="#fff" stroke="#808080" stroke-width="2"/>
  <text x="146" y="98" fill="#000" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="19">https://www.mathewhartley.com/</text>

  <!-- page viewport -->
  <rect x="34" y="116" width="1132" height="484" fill="#000033" stroke="#808080" stroke-width="2"/>
  <!-- rainbow marquee -->
  <rect x="35" y="117" width="1130" height="34" fill="url(#rainbow)"/>
  <text x="600" y="142" text-anchor="middle" fill="#000" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700" font-size="20" letter-spacing="2">*** WELCOME TO MY HOMEPAGE *** THANKS FOR VISITING *** SIGN MY GUESTBOOK ***</text>

  <!-- headline -->
  <g font-family="Comic Sans MS, Chalkboard SE, DejaVu Sans, sans-serif" font-weight="700">
    <text x="84" y="262" fill="#ff00ff" font-size="86" letter-spacing="-2">Mathew Hartley</text>
    <text x="80" y="258" fill="#ffff00" font-size="86" letter-spacing="-2">Mathew Hartley</text>
  </g>
  <text x="82" y="322" fill="#00ffff" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="42">Senior Product Engineer</text>
  <text x="82" y="376" fill="#ffffff" font-family="DejaVu Sans, Verdana, sans-serif" font-size="32">Building AI agents at <tspan fill="#00ff00" font-weight="700">Grw</tspan></text>
  <text x="82" y="428" fill="#ff8800" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="32">Wellington, New Zealand</text>

  <!-- hr -->
  <rect x="82" y="456" width="1036" height="4" fill="#808080"/><rect x="82" y="456" width="1036" height="2" fill="#404040"/>

  <!-- 88x31-style badges row (scaled up) -->
  <g font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700" text-anchor="middle">
    <rect x="82" y="482" width="236" height="62" fill="#000" stroke="#00ff00" stroke-width="3"/>
    <text x="200" y="508" fill="#00ff00" font-size="17">BEST VIEWED IN</text>
    <text x="200" y="532" fill="#00ff00" font-size="19">NETSCAPE 4.0</text>

    <rect x="340" y="482" width="236" height="62" fill="#000" stroke="#ff00ff" stroke-width="3"/>
    <text x="458" y="508" fill="#ff00ff" font-size="17">BUILDING</text>
    <text x="458" y="532" fill="#ff00ff" font-size="19">AI AGENTS</text>

    <rect x="598" y="482" width="236" height="62" fill="#000" stroke="#00ffff" stroke-width="3"/>
    <text x="716" y="508" fill="#00ffff" font-size="17">GUESTBOOK</text>
    <text x="716" y="532" fill="#00ffff" font-size="19">SIGN IT!!</text>

    <!-- friendly badge, not a made-up visitor count -->
    <rect x="856" y="482" width="262" height="62" fill="#000" stroke="#ffff00" stroke-width="3"/>
    <text x="987" y="508" fill="#ffff00" font-size="17">HELLO, INTERNET</text>
    <text x="987" y="532" fill="#fff" font-size="17">YOU'RE WELCOME HERE</text>
  </g>

  <!-- under construction sign -->
  <g transform="translate(946 172) scale(0.82)">
    <rect width="212" height="16" fill="url(#hazard)"/>
    <rect y="16" width="212" height="88" fill="#ffff00" stroke="#000" stroke-width="3"/>
    <text x="106" y="52" text-anchor="middle" fill="#000" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="22">UNDER</text>
    <text x="106" y="84" text-anchor="middle" fill="#000" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="22">CONSTRUCTION</text>
    <rect y="104" width="212" height="16" fill="url(#hazard)"/>
  </g>

  <!-- status bar -->
  <rect x="34" y="566" width="1132" height="34" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  <text x="48" y="590" fill="#000" font-family="DejaVu Sans, Verdana, sans-serif" font-size="17">Document: Done</text>
  <text x="1152" y="590" text-anchor="end" fill="#000" font-family="DejaVu Sans, Verdana, sans-serif" font-size="17">notes · projects · experiments</text>
</svg>
