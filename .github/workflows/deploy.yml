name: Deploy to S3

# Deploys on every push to main (i.e., every PR merge).
# Mirrors `make deploy` exactly: build + s3 sync, HTML fetched fresh.
# Runs from GitHub's OIDC token — no long-lived AWS keys stored.

on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC federation
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:<ROLE_NAME>
          aws-region: ap-southeast-2
          role-session-name: mathewhartley-deploy

      - name: Sync non-HTML (long cache)
        run: |
          aws s3 sync dist/ s3://www.mathewhartley.com/ --delete --cache-control="max-age=1576800000" --exclude "*.html"

      - name: Sync HTML (no-cache)
        run: |
          aws s3 sync dist/ s3://www.mathewhartley.com/ --delete --cache-control="max-age=0, no-cache" --exclude "*" --include "*.html"
