name = "mathewhartley-guestbook"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-23"

[[d1_databases]]
binding = "DB"
database_name = "guestbook"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "GUESTBOOK_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 3
period = 60

[[ratelimits]]
name = "GUESTBOOK_READ_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 60
period = 60

[vars]
GUESTBOOK_ORIGIN = "https://www.mathewhartley.com"
